# tools/sessions.toml: how tools/campaign.py starts headless sessions (GOAL.md §1.10).
# Not frozen by proof.lock. It may hold only command lines, model names and usage-limit patterns (GOAL.md §0.3).
# The command lines (start, resume, login_check) must be campaign.py's SESSION_COMMANDS exactly (checkpoint 0
# follow-up 5): campaign.py refuses to start a session, or the campaign, otherwise. So a CLI flag change is made in
# tools/campaign.py and copied here. Each session-start entry in the journal records this file's sha256.
# The prompt always goes on standard input; campaign.py fixes its text.
# Placeholders: {dir} the session's worktree, {model}, {effort}, {session} the CLI's session or thread id,
# {home} the user's home directory, {wtroot} ../proving-sqlite-wt, {repo} the primary checkout, {config} a Claude
# session's own config directory, state/claude-config/<job>/.
# Every session runs under `nice -n 10` with API-key variables removed from its environment (campaign.py).
# Evidence for every flag: evidence/bringup/10-cli.md.

[vendors.codex]
# Inside bubblewrap (checkpoint 1, Q2 and Q4; campaign.py's command_problems refuses anything looser): / read-only;
#   hidden behind a tmpfs: /tmp, /run/user, /mnt (but /mnt/wsl/resolv.conf, read-only, for DNS on WSL), all of $HOME
#   ({home}), {wtroot} and {repo} (its .git read-only); $HOME and /mnt then remounted read-only. Bound back: {home}/.nvm
#   (node and codex) read-only; {home}/.codex writable (the login, refreshed in place under codex's lock, and the session
#   logs resume reads), less its skills, rules (Zach's interactive allow-list) and memories, each an empty read-only
#   tmpfs; and {dir}. --disable hooks and --disable memories as well. evidence/checkpoint1/07-cli-startup/.
# workspace-write sandbox, inside that: writes only in {dir}, no network, .git outside the workspace read-only.
# exclude_slash_tmp=true (follow-up 8): /tmp is not writable, so concurrent sessions share no scratch space;
# campaign.py sets TMPDIR to {dir}/tmp (ignored by git), emptied at the start of each round.
# --ignore-user-config: no user plugins or model defaults leak in; auth still comes from ~/.codex. It does not turn off
# the ChatGPT connectors (Gmail, Sites deploy and ~300 more tools, which run outside the sandbox), web search or
# subagents, so --disable and web_search="disabled" do. --strict-config rejects a key this codex doesn't know.
# Waiting (checkpoint 0, decision D): background_terminal_max_timeout lets one write_stdin call block until the
# command exits, up to an hour, and features.code_mode.default_exec_yield_time_ms stops the exec cell that wraps it
# from yielding back to the model every 30 s. campaign.py's builder prompt says how to wait (LONG_RUN_CODEX).
start = ["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--tmpfs",
         "/run/user", "--unsetenv", "DBUS_SESSION_BUS_ADDRESS", "--unsetenv", "XDG_RUNTIME_DIR", "--tmpfs", "/mnt",
         "--ro-bind", "/mnt/wsl/resolv.conf", "/mnt/wsl/resolv.conf", "--remount-ro", "/mnt", "--tmpfs", "{home}",
         "--ro-bind", "{home}/.nvm", "{home}/.nvm", "--bind", "{home}/.codex", "{home}/.codex", "--tmpfs",
         "{home}/.codex/skills", "--remount-ro", "{home}/.codex/skills", "--tmpfs", "{home}/.codex/rules",
         "--remount-ro", "{home}/.codex/rules", "--tmpfs", "{home}/.codex/memories", "--remount-ro",
         "{home}/.codex/memories", "--tmpfs", "{wtroot}", "--tmpfs", "{repo}", "--ro-bind", "{repo}/.git",
         "{repo}/.git", "--bind", "{dir}", "{dir}", "--remount-ro", "{home}", "--chdir", "{dir}", "codex", "exec",
         "--json", "--ignore-user-config", "--strict-config", "-c", "sandbox_mode=\"workspace-write\"", "-c",
         "approval_policy=\"never\"", "-c", "sandbox_workspace_write.exclude_slash_tmp=true", "-c",
         "web_search=\"disabled\"", "-c", "background_terminal_max_timeout=3600000", "-c",
         "features.code_mode.default_exec_yield_time_ms=3600000", "--disable", "apps", "--disable", "plugins",
         "--disable", "remote_plugin", "--disable", "tool_suggest", "--disable", "multi_agent", "--disable",
         "multi_agent_v2", "--disable", "image_generation", "--disable", "browser_use", "--disable",
         "browser_use_external", "--disable", "computer_use", "--disable", "in_app_browser", "--disable", "goals",
         "--disable", "hooks", "--disable", "memories", "-m", "{model}", "-c", "model_reasoning_effort=\"{effort}\"",
         "-"]
resume = ["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--tmpfs",
          "/run/user", "--unsetenv", "DBUS_SESSION_BUS_ADDRESS", "--unsetenv", "XDG_RUNTIME_DIR", "--tmpfs", "/mnt",
          "--ro-bind", "/mnt/wsl/resolv.conf", "/mnt/wsl/resolv.conf", "--remount-ro", "/mnt", "--tmpfs", "{home}",
          "--ro-bind", "{home}/.nvm", "{home}/.nvm", "--bind", "{home}/.codex", "{home}/.codex", "--tmpfs",
          "{home}/.codex/skills", "--remount-ro", "{home}/.codex/skills", "--tmpfs", "{home}/.codex/rules",
          "--remount-ro", "{home}/.codex/rules", "--tmpfs", "{home}/.codex/memories", "--remount-ro",
          "{home}/.codex/memories", "--tmpfs", "{wtroot}", "--tmpfs", "{repo}", "--ro-bind", "{repo}/.git",
          "{repo}/.git", "--bind", "{dir}", "{dir}", "--remount-ro", "{home}", "--chdir", "{dir}", "codex", "exec",
          "resume", "{session}", "--json", "--ignore-user-config", "--strict-config", "-c",
          "sandbox_mode=\"workspace-write\"", "-c", "approval_policy=\"never\"", "-c",
          "sandbox_workspace_write.exclude_slash_tmp=true", "-c", "web_search=\"disabled\"", "-c",
          "background_terminal_max_timeout=3600000", "-c", "features.code_mode.default_exec_yield_time_ms=3600000",
          "--disable", "apps", "--disable", "plugins", "--disable", "remote_plugin", "--disable", "tool_suggest",
          "--disable", "multi_agent", "--disable", "multi_agent_v2", "--disable", "image_generation", "--disable",
          "browser_use", "--disable", "browser_use_external", "--disable", "computer_use", "--disable",
          "in_app_browser", "--disable", "goals", "--disable", "hooks", "--disable", "memories", "-m", "{model}",
          "-c", "model_reasoning_effort=\"{effort}\"", "-"]
login_check = ["codex", "login", "status"]
# Printed when a ChatGPT plan's limit stops a session (strings in codex-cli 0.166.0; the apostrophe may be U+2019).
usage_limit_patterns = ["(?i)you.{1,3}ve hit your usage limit", "usage_limit_reached", "(?i)usage limit reached",
                        "(?i)rate_limit_reached"]
# Printed when the ChatGPT login is gone or can't be refreshed (strings in codex-cli 0.166.0): "Your access token could
# not be refreshed … Please log out and sign in again.", "re-run `codex login`", "Run codex login …",
# "no Codex credentials were found", and the refresh_token_failed error kind.
auth_failure_patterns = ["(?i)sign in again", "(?i)codex login", "(?i)access token could not be refreshed",
                         "(?i)no Codex credentials", "refresh_token_failed", "(?i)authentication session could not be refreshed"]

[vendors.claude]
# Inside bubblewrap (checkpoint 0, decision C6 and follow-up 6; checkpoint 1, Q2 and Q4; campaign.py's command_problems
#   refuses anything looser): / read-only; a private /tmp; /run/user empty and DBUS_SESSION_BUS_ADDRESS, XDG_RUNTIME_DIR
#   unset (no desktop services); /mnt hidden (on WSL /mnt/wslg/distro is a second view of /, and /mnt/c holds Windows'
#   Claude Code policy), but /mnt/wsl/resolv.conf, read-only, for DNS; all of $HOME hidden and read-only, but the claude
#   install ({home}/.local/share/claude, {home}/.local/bin/claude), read-only; ~/.codex and ~/.claude each behind
#   their own tmpfs as well, ~/.claude.json covered by /dev/null (kept from checkpoint 0); {wtroot} =
#   ../proving-sqlite-wt, so state/ (session logs) and every other worktree; {repo}, the primary checkout, except its
#   .git, read-only, which the worktree's git needs. --disable-slash-commands and --strict-mcp-config: no skills (the
#   account's synced ones included) and no MCP servers (the account's claude.ai connectors included). --tools
#   allows only Bash, Read, Write, Edit, Glob, Grep, Monitor, TaskStop and ToolSearch (Zach and the auditor, after T-011).
#   Writable: the session's own worktree {dir}, and {config}, its own CLAUDE_CONFIG_DIR, which campaign.py creates
#   under state/claude-config/ and seeds with a copy of the login only. A resumed session gets its own directory back.
# Auto permission mode: no prompts; unsafe actions are refused. Network stays on: Claude Code needs it.
start = ["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--tmpfs",
         "/run/user", "--unsetenv", "DBUS_SESSION_BUS_ADDRESS", "--unsetenv", "XDG_RUNTIME_DIR", "--tmpfs", "/mnt",
         "--ro-bind", "/mnt/wsl/resolv.conf", "/mnt/wsl/resolv.conf", "--remount-ro", "/mnt", "--tmpfs", "{home}",
         "--ro-bind", "{home}/.local/share/claude", "{home}/.local/share/claude", "--ro-bind",
         "{home}/.local/bin/claude", "{home}/.local/bin/claude", "--tmpfs", "{home}/.codex", "--tmpfs",
         "{home}/.claude", "--ro-bind", "/dev/null", "{home}/.claude.json", "--tmpfs", "{wtroot}", "--tmpfs",
         "{repo}", "--ro-bind", "{repo}/.git", "{repo}/.git", "--bind", "{config}", "{config}", "--setenv",
         "CLAUDE_CONFIG_DIR", "{config}", "--bind", "{dir}", "{dir}", "--remount-ro", "{home}", "--chdir", "{dir}",
         "claude", "-p", "--disable-slash-commands", "--strict-mcp-config", "--tools",
         "Bash,Read,Write,Edit,Glob,Grep,Monitor,TaskStop,ToolSearch", "--model", "{model}", "--effort",
         "{effort}", "--permission-mode", "auto", "--output-format", "stream-json", "--verbose",
         "--include-partial-messages"]
resume = ["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--tmpfs",
          "/run/user", "--unsetenv", "DBUS_SESSION_BUS_ADDRESS", "--unsetenv", "XDG_RUNTIME_DIR", "--tmpfs", "/mnt",
          "--ro-bind", "/mnt/wsl/resolv.conf", "/mnt/wsl/resolv.conf", "--remount-ro", "/mnt", "--tmpfs", "{home}",
          "--ro-bind", "{home}/.local/share/claude", "{home}/.local/share/claude", "--ro-bind",
          "{home}/.local/bin/claude", "{home}/.local/bin/claude", "--tmpfs", "{home}/.codex", "--tmpfs",
          "{home}/.claude", "--ro-bind", "/dev/null", "{home}/.claude.json", "--tmpfs", "{wtroot}", "--tmpfs",
          "{repo}", "--ro-bind", "{repo}/.git", "{repo}/.git", "--bind", "{config}", "{config}", "--setenv",
          "CLAUDE_CONFIG_DIR", "{config}", "--bind", "{dir}", "{dir}", "--remount-ro", "{home}", "--chdir", "{dir}",
          "claude", "-p", "--resume", "{session}", "--disable-slash-commands", "--strict-mcp-config",
          "--tools", "Bash,Read,Write,Edit,Glob,Grep,Monitor,TaskStop,ToolSearch", "--model",
          "{model}", "--effort", "{effort}", "--permission-mode", "auto", "--output-format", "stream-json",
          "--verbose", "--include-partial-messages"]
login_check = ["claude", "auth", "status"]
# Printed when a Claude subscription limit stops a session (strings in Claude Code 2.1.319), plus the
# stream-json rate_limit_event whose status is "rejected".
usage_limit_patterns = ["(?i)you.{1,3}ve hit your (usage )?limit", "(?i)usage limit reached", "(?i)claude ai usage limit",
                        "\"status\":\\s*\"rejected\"", "(?i)5-hour limit", "(?i)weekly limit"]
# Printed when the login is gone, expired or revoked (strings in Claude Code 2.1.319): "Login expired · Please run
# /login", "OAuth token revoked · Please run /login", "Failed to authenticate: …", "Not logged in. Run claude auth login",
# "API Error: 401 Invalid API key · Please run /login", and the authentication_failed error kind.
auth_failure_patterns = ["Please run /login", "(?i)login expired", "(?i)not logged in", "(?i)OAuth (access )?token (has )?(expired|been revoked|revoked)",
                         "(?i)failed to authenticate", "authentication_failed", "authentication_error", "(?i)invalid api key",
                         "(?i)login reached its time limit"]

# Roles and tiers (GOAL.md §0.10). The vendor lines must match campaign.py's ROLE_VENDOR (builder, spec-review and
# finding-review on codex, reviewer and ledger on claude), which it uses whatever this file says, refusing a mismatch; and it refuses a
# reviewer on the vendor that built the round it judges, re-reviews included. Each model and effort must be a plain
# name, ^[A-Za-z0-9._-]+$ not starting with '-' (auditor recheck item 2): campaign.py refuses anything else.
[roles.builder.high]
vendor = "codex"
model = "gpt-6-astra"
effort = "xhigh"

[roles.builder.standard]
vendor = "codex"
model = "gpt-6-astra"
effort = "high"

[roles.reviewer.high]
vendor = "claude"
model = "claude-opus-5-5"
effort = "high"

[roles.reviewer.standard]
vendor = "claude"
model = "claude-sonnet-5-5"
effort = "high"

[roles.ledger.high]
vendor = "claude"
model = "claude-opus-5-5"
effort = "high"

# Finding drafts found on Claude, or reproduced by the auditor, get a Codex judgement (Zach, 2026-11-11).
[roles.finding-review.high]
vendor = "codex"
model = "gpt-6-astra"
effort = "xhigh"

# The file-format spec is written by Claude (the setup session), so Astra reviews it.
[roles.spec-review.standard]
vendor = "codex"
model = "gpt-6-astra"
effort = "high"
